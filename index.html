<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pampa Truqueiro</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<div id="app">

  <!-- TELA DE INICIO -->
  <section id="splashScreen" class="screen active">
    <div id="splashFrame" class="frame fit-w" style="background-image:url('assets/backgrounds/splash.png');">
      <div id="splashVeil"></div>
      <div id="splashPrompt">TOQUE PARA COMEÇAR</div>
    </div>
  </section>

  <!-- MENU PRINCIPAL -->
  <section id="menuScreen" class="screen">
    <div id="menuFrame" class="frame fit-w" style="background-image:url('assets/backgrounds/menu.png');">
      <button id="btnIniciar" class="hotspot" aria-label="Iniciar"><span class="glow"></span></button>
      <button id="btnConfig" class="hotspot" aria-label="Configurações"><span class="glow"></span></button>
    </div>
  </section>

  <!-- O mesmo menu aprovado, com duas camadas independentes de rótulos. -->
  <section id="modeScreen" class="screen" aria-label="Seleção de modos">
    <div id="modeFrame" class="frame fit-w" style="background-image:url('assets/backgrounds/menu.png');">
      <svg class="mode-labels" viewBox="0 0 1600 874" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <image href="assets/ui/label-1v1.png" x="680" y="324" width="244" height="64"/>
        <image href="assets/ui/label-1v-maquina.png" x="682" y="462" width="320" height="68"/>
      </svg>
      <button id="btn1v1" class="hotspot" type="button" aria-label="1v1"><span class="mode-label-text">1v1</span><span class="glow"></span></button>
      <button id="btn1vUI" class="hotspot" type="button" aria-label="1vMáquina"><span class="mode-label-text">1vMáquina</span><span class="glow"></span></button>
      <button id="btnBack" type="button" aria-label="Voltar ao menu principal">← Voltar</button>
    </div>
  </section>

  <!-- Composição em camadas: cenário ilustrado, mesa CSS e controles HTML. -->
  <section id="gameScreen" class="screen" aria-labelledby="gameTitle">
    <div class="saloon">
      <div class="table-rail" aria-hidden="true"><div class="table-felt"></div></div>
      <aside class="scoreboard ornate" aria-label="Placar reservado, sem pontuação implementada">
        <span class="score-crest" aria-hidden="true">✦</span>
        <div class="score-columns"><div><span>Ele</span><b>—</b></div><div><span>Eu</span><b>—</b></div></div>
        <small>Placar em breve</small>
      </aside>
      <h1 id="gameTitle" class="ornate">Truco · 1 contra 1</h1>
      <figure class="portrait opponent"><img src="assets/characters/opponent.png" alt="Retrato do adversário"><figcaption data-opponent-name></figcaption></figure>
      <div class="card-hand opponent-hand" aria-label="Cartas do adversário viradas para baixo"></div>
      <div class="deck-stack" role="img" aria-label="Monte decorativo de cartas"><div class="demo-card card-back" data-card-back aria-label="Carta demonstrativa virada para baixo"><span aria-hidden="true">✦</span></div></div>
      <div class="played-area" aria-label="Espaço reservado para três pares de cartas jogadas"><div class="played-pair" aria-label="Par 1"><div class="card-slot"></div><div class="card-slot"></div></div><div class="played-pair" aria-label="Par 2"><div class="card-slot"></div><div class="card-slot"></div></div><div class="played-pair" aria-label="Par 3"><div class="card-slot"></div><div class="card-slot"></div></div></div>
      <figure class="portrait player"><img src="assets/characters/player.png" alt="Retrato provisório do você"><figcaption>Você</figcaption></figure>
      <div class="card-hand human-hand" aria-label="Suas cartas"></div>
      <div class="future-actions" aria-label="Ações futuras indisponíveis">
        <button class="ornate" type="button" disabled><span aria-hidden="true">◉</span> Envido</button>
        <button class="ornate" type="button" disabled><span aria-hidden="true">♛</span> Real Envido</button>
        <button class="ornate" type="button" disabled><span aria-hidden="true">✦</span> Falta Envido</button>
        <button class="ornate" type="button" disabled><span aria-hidden="true">✿</span> Flor</button>
      </div>
      <span id="gameStatus" class="demo-notice" role="status" aria-live="polite" aria-atomic="true"></span>
      <button id="btnNewHand" class="ornate new-hand-button" type="button" hidden>Nova mão</button>
      <button id="btnGameConfig" class="side-button settings-button" type="button" aria-label="Configurações da partida"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m10 1 4 0 1 4 3 1 3-1 2 4-3 3v2l3 3-2 4-3-1-3 1-1 4h-4l-1-4-3-1-3 1-2-4 3-3v-2L1 9l2-4 3 1 3-1z"/><circle cx="12" cy="12" r="4" fill="#d6a34f"/></svg></button>
      <button class="side-button sound-button" type="button" disabled aria-label="Som indisponível nesta etapa" title="Som indisponível nesta etapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h5l6-6v18l-6-6H3z"/><path fill="none" stroke="currentColor" stroke-width="2" d="M17 7q7 5 0 10"/></svg></button>
      <button id="btnGameBack" class="ornate game-back" type="button">← Menu</button>
    </div>
  </section>

</div>

<!-- MODAL CONFIGURAÇÕES -->
<div id="modalVeil">
  <div class="panel">
    <h2>CONFIGURAÇÕES</h2>
    <div class="row">
      <label for="volMusic">MÚSICA</label>
      <input type="range" id="volMusic" min="0" max="100" value="70">
    </div>
    <div class="row">
      <label for="volSfx">EFEITOS</label>
      <input type="range" id="volSfx" min="0" max="100" value="80">
    </div>
    <div class="row">
      <label for="dificuldade">DIFICULDADE</label>
      <select id="dificuldade">
        <option value="facil">FÁCIL</option>
        <option value="normal" selected>NORMAL</option>
        <option value="dificil">DIFÍCIL</option>
      </select>
    </div>
    <div class="panel-actions">
      <button class="pbtn" id="btnFechar">FECHAR</button>
      <button class="pbtn primary" id="btnSalvar">SALVAR</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
